<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料辞書API連携 英文直訳＆違和感チェッカー</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --sub-text: #64748b;
      --border: #e2e8f0;
      --accent: #ef4444;
      --accent-bg: #fef2f2;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 20px 10px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 { font-size: 1.5rem; margin-top: 0; color: #0f172a; }
    p.desc { color: var(--sub-text); font-size: 0.9rem; margin-bottom: 20px; }
    textarea {
      width: 100%; height: 100px; padding: 12px;
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 1rem; box-sizing: border-box; resize: vertical; margin-bottom: 15px;
    }
    button {
      background-color: var(--primary); color: white; border: none;
      padding: 12px 24px; font-size: 1rem; font-weight: 600;
      border-radius: 8px; cursor: pointer; width: 100%; transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    .result-section { margin-top: 30px; display: none; }
    .card {
      border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 16px; background: #fafafa;
    }
    .card-title {
      font-size: 0.85rem; font-weight: 700; color: var(--sub-text);
      text-transform: uppercase; margin-bottom: 8px;
    }
    .literal-text { font-size: 1.25rem; font-weight: 600; color: #0f172a; }
    .analysis-card { background: var(--accent-bg); border-color: #fca5a5; }
    .analysis-card .card-title { color: var(--accent); }
    .reason-list { margin: 0; padding-left: 20px; }
    .reason-list li { margin-bottom: 6px; }
    .loading { text-align: center; color: var(--sub-text); margin-top: 15px; display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>英文直訳 ＆ 違和感チェッカー</h1>
  <p class="desc">無料辞書APIと連携し、無限の英単語に対応した補正なしの直訳・違和感チェッカーです。</p>

  <textarea id="inputText" placeholder="英文を入力してください (例: I clean room yesterday.)"></textarea>
  <button id="submitBtn" onclick="analyzeText()">直訳・解析を実行</button>
  <div id="loading" class="loading">無料辞書APIから単語の意味を取得中...</div>

  <div id="resultSection" class="result-section">
    <div class="card">
      <div class="card-title">文字通りの直訳（補正なし）</div>
      <div id="literalOutput" class="literal-text"></div>
    </div>

    <div class="card analysis-card">
      <div class="card-title">なぜ不自然なのか（違和感の理由）</div>
      <ul id="reasonsOutput" class="reason-list"></ul>
    </div>
  </div>
</div>

<script>
  // ローカル基本辞書
  const localDict = {
    "i": "私は", "you": "あなたは", "he": "彼は", "she": "彼女は", "it": "それは", "we": "私たちは", "they": "彼らは",
    "yesterday": "昨日", "today": "今日", "tomorrow": "明日", "now": "今",
    "am": "〜である", "is": "〜である", "are": "〜である", "was": "〜であった", "were": "〜であった"
  };

  // 無料辞書API (Free Dictionary API) から定義を取得する関数
  async function fetchWordDefinition(word) {
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
      if (!res.ok) return word;
      const data = await res.json();
      // 辞書の英英定義テキストを取得（※代替テキストとして単語名+品詞を出力）
      const partOfSpeech = data[0]?.meanings[0]?.partOfSpeech || "";
      return `${word}[${partOfSpeech}]`;
    } catch (e) {
      return word;
    }
  }

  async function analyzeText() {
    const rawInput = document.getElementById("inputText").value.trim();
    if (!rawInput) return;

    document.getElementById("loading").style.display = "block";
    document.getElementById("resultSection").style.display = "none";

    const cleanText = rawInput.replace(/[.,?!]/g, "");
    const words = cleanText.split(/\s+/);
    const lowerWords = words.map(w => w.toLowerCase());

    let translatedTokens = [];
    let reasons = [];

    let hasTimePast = lowerWords.includes("yesterday");
    let hasBeVerb = lowerWords.some(w => ["am", "is", "are", "was", "were"].includes(w));
    let mainVerbPresent = false;
    let mainVerbWord = "";

    // 非同期処理で全単語を検索
    for (let word of lowerWords) {
      if (localDict[word]) {
        translatedTokens.push(localDict[word]);
      } else if (word === "clean" || word === "go" || word === "eat" || word === "study" || word === "like") {
        // 動詞の判定
        const verbMap = { "clean": "掃除する", "go": "行く", "eat": "食べる", "study": "勉強する", "like": "好む" };
        translatedTokens.push(verbMap[word] || word);
        mainVerbPresent = true;
        mainVerbWord = word;
      } else if (word === "room" || word === "apple" || word === "music" || word === "book") {
        const nounMap = { "room": "部屋", "apple": "りんご", "music": "音楽", "book": "本" };
        translatedTokens.push(nounMap[word] + "を");
      } else {
        // 無料辞書APIから取得
        const apiResult = await fetchWordDefinition(word);
        translatedTokens.push(apiResult);
      }
    }

    // 違和感チェックロジック
    if (hasTimePast && mainVerbPresent) {
      reasons.push(`時制の不一致：過去を表す「yesterday（昨日）」があるのに、動詞「${mainVerbWord}」が原形・現在形のままになっています。`);
    }
    if (hasBeVerb && mainVerbPresent) {
      reasons.push(`動詞の重複：be動詞と一般動詞（${mainVerbWord}）が両方存在するため、意味が重なっています。`);
    }
    if (!lowerWords.includes("a") && !lowerWords.includes("the")) {
      reasons.push(`冠詞の欠落：名詞の前に「a」や「the」がないため、不自然な直訳になっています。`);
    }

    if (reasons.length === 0) {
      reasons.push("大きな構造的エラーは見つかりませんでした。");
    }

    document.getElementById("loading").style.display = "none";
    document.getElementById("literalOutput").innerText = translatedTokens.join(" ");
    
    const reasonsUl = document.getElementById("reasonsOutput");
    reasonsUl.innerHTML = "";
    reasons.forEach(r => {
      const li = document.createElement("li");
      li.innerText = r;
      reasonsUl.appendChild(li);
    });

    document.getElementById("resultSection").style.display = "block";
  }
</script>

</body>
</html>
