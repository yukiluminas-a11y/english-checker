<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英文直訳＆セルフ添削チェッカー（APIキー直書き版）</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            min-height: 120px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .result-section {
            display: none;
        }
        .result-box {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }
        .result-box.warning {
            border-left-color: #eab308;
            background-color: #fefce8;
        }
        .error-msg {
            color: #dc2626;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>英文直訳＆セルフ添削チェッカー</h1>
        <p>英文を入力するだけで、補完なしの直訳と不自然な箇所の指摘を表示します。</p>
    </header>

    <div class="card">
        <label for="englishInput">チェックしたい英文を入力</label>
        <textarea id="englishInput" placeholder="例: I go to park yesterday."></textarea>
        <button id="checkBtn" onclick="checkEnglish()">直訳とチェックを実行する</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <div id="resultSection" class="card result-section">
        <label>1. 直訳（内容補完なし）</label>
        <div id="literalOutput" class="result-box"></div>

        <label>2. 不自然な部分の指摘</label>
        <div id="feedbackOutput" class="result-box warning"></div>
    </div>
</div>

<script>
    async function checkEnglish() {
        // ★ここにあなたのAPIキーを直接記述します
        const apiKey = "ここにあなたのAPIキーを貼り付けてください";
        
        const englishText = document.getElementById('englishInput').value.trim();
        const checkBtn = document.getElementById('checkBtn');
        const errorMsg = document.getElementById('errorMsg');
        const resultSection = document.getElementById('resultSection');
        const literalOutput = document.getElementById('literalOutput');
        const feedbackOutput = document.getElementById('feedbackOutput');

        errorMsg.style.display = 'none';
        if (!englishText) {
            showError('英文を入力してください。');
            return;
        }

        checkBtn.disabled = true;
        checkBtn.textContent = '分析中...';
        resultSection.style.display = 'none';

        const systemInstruction = `あなたは英語学習者向けの厳格な直訳・添削アシスタントです。以下の2つの項目のみをJSON形式で出力してください。
1. "literal_translation"（直訳）: 意訳や文法ミスの自動修正を一切せず、単語や時制、冠詞の有無をそのまま反映した直訳の日本語。
2. "unnatural_points"（不自然な部分の指摘）: 文法の誤りや不自然な点を箇条書きで指摘し、完成解答ではなくヒントを中心に解説。`;

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;

        const payload = {
            system_instruction: { parts: [{ text: systemInstruction }] },
            contents: [{ parts: [{ text: englishText }] }],
            generationConfig: {
                temperature: 0.2,
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        literal_translation: { type: "STRING" },
                        unnatural_points: { type: "STRING" }
                    },
                    required: ["literal_translation", "unnatural_points"]
                }
            }
        };

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || '通信エラー');

            const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
            literalOutput.textContent = parsed.literal_translation;
            feedbackOutput.textContent = parsed.unnatural_points;
            resultSection.style.display = 'block';
        } catch (err) {
            showError(`エラー: ${err.message}`);
        } finally {
            checkBtn.disabled = false;
            checkBtn.textContent = '直訳とチェックを実行する';
        }
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }
</script>

</body>
</html>
